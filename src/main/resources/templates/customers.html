<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customers</title>
<style>:root{--blue:#0b6cf6;--purple:#7c3aed;--bg:#f6f8fb;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui;color:#0f172a}header{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;background:white;border-bottom:1px solid #e2e8f0;gap:18px;flex-wrap:wrap}.brand{font-weight:800;font-size:20px}nav{display:flex;gap:8px;flex-wrap:wrap}a,.btn{padding:10px 14px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:650;border:0;cursor:pointer;background:white}nav a.active{background:linear-gradient(90deg,var(--blue),var(--purple));color:white}.wrap{max-width:1100px;margin:28px auto;padding:0 20px}.card{background:white;border:1px solid #e2e8f0;border-radius:14px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px;border-bottom:1px solid #edf2f7}th{color:var(--muted);background:#f8fafc}.muted{color:var(--muted)}</style></head>
<body><header><div class="brand">IX InsureX Admin</div><nav><a th:href="@{/admin}">Dashboard</a><a th:href="@{/admin/policies}">Policies</a><a th:href="@{/admin/claims}">Applications</a><a class="active" th:href="@{/admin/customers}">Customers</a></nav><form th:action="@{/logout}" method="post"><button class="btn">Sign out</button></form></header><main class="wrap"><h1>Customers</h1><p class="muted">Registered customer accounts.</p><div class="card"><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Date of birth</th></tr></thead><tbody><tr th:each="customer:${customers}"><td th:text="${customer.userId}">1</td><td th:text="${customer.username}">Name</td><td th:text="${customer.email}">Email</td><td th:text="${customer.phoneNumber ?: '-'}">-</td><td th:text="${customer.dob ?: '-'}">-</td></tr><tr th:if="${#lists.isEmpty(customers)}"><td colspan="5" class="muted">No customers registered.</td></tr></tbody></table></div></main></body></html>
