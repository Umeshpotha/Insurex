<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>InsureX — Policy Presets</title>
    <style>
        :root{
            --bg:#f6f8fb;
            --card:#ffffff;
            --accent:#0b6cf6;
            --muted:#6b7280;
            --success:#16a34a;
            --danger:#ef4444;
            --warning:#f59e0b;
            --info:#3b82f6;
            --radius:10px;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        }
        html,body{height:100%;overflow-x:hidden;}
        body{
            margin:0;
            background:var(--bg);
            color:#0f172a;
            -webkit-font-smoothing:antialiased;
            -moz-osx-font-smoothing:grayscale;
            padding:16px;
            box-sizing:border-box;
            min-height:100vh;
            display:flex;
            flex-direction:column;
        }
        header{
            display:flex;
            gap:16px;
            align-items:center;
            justify-content:space-between;
            margin-bottom:24px;
            flex-wrap:wrap;
            width:100%;
        }
        .brand{
            display:flex;
            gap:12px;
            align-items:center;
        }
        .logo{
            width:44px;
            height:44px;
            background:linear-gradient(135deg,var(--accent),#7c3aed);
            border-radius:10px;
            display:inline-grid;
            place-items:center;
            color:white;
            font-weight:700;
            box-shadow:0 4px 14px rgba(11,108,246,0.14);
        }
        .brand-text h2{
            margin:0;
            font-size:18px;
            font-weight:700;
            color:#0f172a;
        }
        .brand-text p{
            margin:0;
            font-size:12px;
            color:var(--muted);
        }
        nav ul{
            display:flex;
            gap:12px;
            list-style:none;
            padding:0;
            margin:0;
            align-items:center;
            flex-wrap:wrap;
        }
        nav a{
            color:var(--muted);
            text-decoration:none;
            padding:8px 12px;
            border-radius:8px;
            font-size:14px;
            transition:all .2s ease;
        }
        nav a:hover{
            color:var(--accent);
        }
        nav a.active{
            background:linear-gradient(90deg, rgba(11,108,246,0.12), rgba(124,58,237,0.06));
            color:var(--accent);
            font-weight:600;
        }
        .controls{
            display:flex;
            gap:12px;
            align-items:center;
        }
        .btn{
            border:0;
            padding:10px 14px;
            border-radius:8px;
            background:var(--card);
            cursor:pointer;
            box-shadow:0 1px 2px rgba(16,24,40,0.04);
            color:var(--muted);
            font-weight:600;
            font-size:14px;
            transition:all .2s ease;
        }
        .btn:hover{
            background:#f3f4f6;
        }
        .btn.primary{
            background:linear-gradient(90deg,var(--accent),#7c3aed);
            color:white;
            box-shadow:0 8px 24px rgba(11,108,246,0.12);
        }
        .btn.primary:hover{
            transform:translateY(-2px);
            box-shadow:0 12px 32px rgba(11,108,246,0.16);
        }

        .page-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:24px;
            gap:16px;
            flex-wrap:wrap;
        }
        .page-header h1{
            margin:0;
            font-size:28px;
            color:#0f172a;
            display:flex;
            align-items:center;
            gap:12px;
        }
        .page-header .icon{
            width:36px;
            height:36px;
            background:linear-gradient(135deg,var(--accent),#7c3aed);
            border-radius:10px;
            display:grid;
            place-items:center;
            color:white;
            font-weight:700;
        }

        .filters{
            display:flex;
            gap:12px;
            margin-bottom:20px;
            flex-wrap:wrap;
            align-items:center;
        }
        .search-box{
            display:flex;
            gap:8px;
            align-items:center;
            background:var(--card);
            padding:10px 12px;
            border-radius:10px;
            flex:1;
            min-width:200px;
            box-shadow:0 1px 2px rgba(16,24,40,0.04);
        }
        .search-box input{
            border:0;
            outline:0;
            width:100%;
            font-size:14px;
            background:transparent;
        }
        .search-box input::placeholder{
            color:var(--muted);
        }
        .filter-btn{
            padding:10px 12px;
            border:1px solid #e5e7eb;
            background:var(--card);
            border-radius:8px;
            cursor:pointer;
            font-size:14px;
            color:var(--muted);
            transition:all .2s ease;
        }
        .filter-btn:hover{
            border-color:var(--accent);
            color:var(--accent);
        }
        .filter-btn.active{
            background:linear-gradient(90deg, rgba(11,108,246,0.12), rgba(124,58,237,0.06));
            border-color:var(--accent);
            color:var(--accent);
            font-weight:600;
        }

        .policies-container{
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
            gap:16px;
            margin-bottom:24px;
        }

        .policy-card{
            background:var(--card);
            border:1px solid #e5e7eb;
            border-radius:12px;
            padding:16px;
            box-shadow:0 1px 3px rgba(16,24,40,0.06);
            transition:all .2s ease;
            cursor:pointer;
            display:flex;
            flex-direction:column;
            gap:12px;
        }
        .policy-card:hover{
            border-color:var(--accent);
            box-shadow:0 8px 24px rgba(11,108,246,0.12);
            transform:translateY(-4px);
        }

        .policy-header{
            display:flex;
            justify-content:space-between;
            align-items:flex-start;
            gap:8px;
        }
        .policy-name{
            font-weight:700;
            font-size:16px;
            color:#0f172a;
            margin:0;
        }
        .policy-badge{
            padding:4px 8px;
            border-radius:6px;
            font-size:12px;
            font-weight:600;
            white-space:nowrap;
        }
        .policy-badge.active{
            background:rgba(22,163,74,0.12);
            color:var(--success);
        }
        .policy-badge.inactive{
            background:rgba(239,68,68,0.12);
            color:var(--danger);
        }
        .policy-badge.draft{
            background:rgba(107,114,128,0.12);
            color:var(--muted);
        }

        .policy-meta{
            display:flex;
            gap:12px;
            font-size:13px;
            color:var(--muted);
            padding-top:8px;
            border-top:1px solid #f3f4f6;
        }
        .meta-item{
            display:flex;
            align-items:center;
            gap:4px;
        }

        .policy-description{
            font-size:13px;
            color:var(--muted);
            line-height:1.5;
            margin:0;
        }

        .policy-details{
            display:grid;
            gap:8px;
            padding:8px 0;
            border-top:1px solid #f3f4f6;
            border-bottom:1px solid #f3f4f6;
        }
        .detail-row{
            display:flex;
            justify-content:space-between;
            align-items:center;
            font-size:13px;
        }
        .detail-label{
            color:var(--muted);
        }
        .detail-value{
            font-weight:600;
            color:#0f172a;
        }

        .policy-actions{
            display:flex;
            gap:8px;
        }
        .policy-btn{
            flex:1;
            padding:8px 12px;
            border:1px solid #e5e7eb;
            background:transparent;
            border-radius:6px;
            cursor:pointer;
            font-size:13px;
            font-weight:600;
            color:var(--muted);
            transition:all .2s ease;
        }
        .policy-btn:hover{
            border-color:var(--accent);
            color:var(--accent);
            background:rgba(11,108,246,0.04);
        }
        .policy-btn.delete{
            color:var(--danger);
            border-color:var(--danger);
        }
        .policy-btn.delete:hover{
            background:rgba(239,68,68,0.04);
        }

        .table-view{
            background:var(--card);
            border:1px solid #e5e7eb;
            border-radius:12px;
            box-shadow:0 1px 3px rgba(16,24,40,0.06);
            overflow:hidden;
        }
        table{
            width:100%;
            border-collapse:collapse;
        }
        thead{
            background:#f9fafb;
            border-bottom:1px solid #e5e7eb;
        }
        th{
            padding:12px 16px;
            text-align:left;
            font-weight:600;
            font-size:13px;
            color:var(--muted);
            text-transform:uppercase;
            letter-spacing:0.5px;
        }
        td{
            padding:14px 16px;
            border-bottom:1px solid #f3f4f6;
            font-size:14px;
        }
        tbody tr{
            transition:background .2s ease;
        }
        tbody tr:hover{
            background:#f9fafb;
        }
        tbody tr:last-child td{
            border-bottom:0;
        }

        .status-indicator{
            width:8px;
            height:8px;
            border-radius:50%;
            display:inline-block;
            margin-right:6px;
        }
        .status-indicator.active{
            background:var(--success);
        }
        .status-indicator.inactive{
            background:var(--danger);
        }
        .status-indicator.draft{
            background:var(--muted);
        }

        .view-toggle{
            display:flex;
            gap:8px;
            margin-bottom:16px;
            align-items:center;
        }
        .view-toggle button{
            width:36px;
            height:36px;
            border:1px solid #e5e7eb;
            background:var(--card);
            border-radius:6px;
            cursor:pointer;
            display:grid;
            place-items:center;
            color:var(--muted);
            font-size:16px;
            transition:all .2s ease;
        }
        .view-toggle button.active{
            background:linear-gradient(90deg, rgba(11,108,246,0.12), rgba(124,58,237,0.06));
            border-color:var(--accent);
            color:var(--accent);
        }
        .view-toggle button:hover{
            border-color:var(--accent);
        }

        .empty-state{
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            padding:40px 20px;
            text-align:center;
            color:var(--muted);
        }
        .empty-state .icon{
            font-size:48px;
            margin-bottom:12px;
            opacity:0.5;
        }
        .empty-state h3{
            margin:0 0 8px 0;
            color:#0f172a;
            font-size:16px;
        }
        .empty-state p{
            margin:0 0 16px 0;
            font-size:14px;
        }

        footer{
            margin-top:auto;
            padding-top:20px;
            border-top:1px solid #e5e7eb;
            text-align:center;
            color:var(--muted);
            font-size:12px;
        }

        @media (max-width: 1200px){
            .policies-container{
                grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
            }
        }

        @media (max-width: 768px){
            header{
                margin-bottom:16px;
            }
            nav ul{
                display:none;
            }
            .page-header{
                margin-bottom:16px;
            }
            .page-header h1{
                font-size:22px;
            }
            .filters{
                flex-direction:column;
            }
            .search-box{
                min-width:100%;
            }
            .policies-container{
                grid-template-columns:1fr;
            }
            table{
                font-size:12px;
            }
            th, td{
                padding:10px 12px;
            }
            .controls{
                display:none;
            }
        }

        @media (max-width: 480px){
            body{
                padding:12px;
            }
            header{
                flex-direction:column;
                align-items:flex-start;
            }
            .page-header{
                flex-direction:column;
                align-items:flex-start;
            }
            .page-header h1{
                font-size:18px;
            }
            .policy-card{
                padding:12px;
            }
            .btn{
                padding:8px 12px;
                font-size:13px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <div class="logo">IX</div>
            <div class="brand-text">
                <h2>InsureX</h2>
                <p>Policy Management</p>
            </div>
        </div>
        <nav>
            <ul>
                <li><a href="adminHome.html">Dashboard</a></li>
                <li><a href="policies.html" class="active">Policies</a></li>
                <li><a href="#claims">Claims</a></li>
                <li><a href="#customers">Customers</a></li>
            </ul>
        </nav>
        <div class="controls">
            <button class="btn">🔔 Notifications</button>
            <button class="btn">👤 Profile</button>
        </div>
    </header>

    <div class="page-header">
        <h1>
            <div class="icon">📋</div>
            Policy Presets
        </h1>
        <button class="btn primary" onclick="">+ Create Policy</button>
    </div>

    <div class="filters">
        <div class="search-box">
            <span>🔍</span>
            <input type="search" placeholder="Search policies..." onkeyup="filterPolicies(this.value)">
        </div>
        <button class="filter-btn active" onclick="filterByStatus('all', this)">All</button>
        <button class="filter-btn" onclick="filterByStatus('active', this)">Active</button>
        <button class="filter-btn" onclick="filterByStatus('inactive', this)">Inactive</button>
        <button class="filter-btn" onclick="filterByStatus('draft', this)">Draft</button>
    </div>

    <div class="view-toggle">
        <button class="active" onclick="switchView('cards', this)" title="Card View">⊞</button>
        <button onclick="switchView('table', this)" title="Table View">≡</button>
    </div>

    <!-- Card View -->
    <div id="cardsView" class="policies-container">
        <!-- Policy cards will be dynamically inserted here -->
    </div>

    <!-- Table View -->
    <div id="tableView" class="table-view" style="display:none;">
        <table>
            <thead>
                <tr>
                    <th>Policy Name</th>
                    <th>Type</th>
                    <th>Coverage Amount</th>
                    <th>Premium</th>
                    <th>Status</th>
                    <th>Created</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Table rows will be dynamically inserted here -->
            </tbody>
        </table>
    </div>

    <footer>
        © <span th:text="${#dates.year(#dates.createNow())}">2026</span> InsureX. All rights reserved.
    </footer>

    <!-- Modal for creating/editing policies -->
   

    <script>
        // Sample policy data
        let allPolicies = [
            {
                id: 1,
                name: "Comprehensive Auto Coverage",
                type: "Auto",
                coverage: 500000,
                premium: 149.99,
                status: "active",
                description: "Full coverage including collision, comprehensive, and liability.",
                created: "2025-12-15",
                holder: "Standard Users"
            },
            {
                id: 2,
                name: "Home Protection Plan",
                type: "Home",
                coverage: 750000,
                premium: 199.99,
                status: "active",
                description: "Complete home and contents protection with emergency coverage.",
                created: "2025-11-08",
                holder: "Premium Users"
            },
            {
                id: 3,
                name: "Health Plus",
                type: "Health",
                coverage: 1000000,
                premium: 299.99,
                status: "active",
                description: "Comprehensive health coverage with wellness benefits.",
                created: "2025-10-22",
                holder: "Corporate"
            },
            {
                id: 4,
                name: "Life Assurance Premium",
                type: "Life",
                coverage: 2000000,
                premium: 89.99,
                status: "inactive",
                description: "Term life insurance with optional riders.",
                created: "2025-09-12",
                holder: "Premium Users"
            },
            {
                id: 5,
                name: "Travel Guardian",
                type: "Travel",
                coverage: 250000,
                premium: 49.99,
                status: "draft",
                description: "International travel coverage including medical and evacuation.",
                created: "2025-12-01",
                holder: "Test"
            },
            {
                id: 6,
                name: "Auto Plus Extended",
                type: "Auto",
                coverage: 600000,
                premium: 179.99,
                status: "active",
                description: "Enhanced auto coverage with roadside assistance and rental car.",
                created: "2025-08-30",
                holder: "Standard Users"
            }
        ];

        let currentFilter = 'all';
        let currentView = 'cards';
        let filteredPolicies = [...allPolicies];

        function renderPolicies() {
            const cardsContainer = document.getElementById('cardsView');
            const tableBody = document.getElementById('tableBody');
            
            // Clear containers
            cardsContainer.innerHTML = '';
            tableBody.innerHTML = '';

            if (filteredPolicies.length === 0) {
                cardsContainer.innerHTML = `
                    <div style="grid-column:1/-1;">
                        <div class="empty-state">
                            <div class="icon">📭</div>
                            <h3>No policies found</h3>
                            <p>Try adjusting your filters or create a new policy preset.</p>
                            <button class="btn primary" onclick="openCreateModal()">+ Create First Policy</button>
                        </div>
                    </div>
                `;
                return;
            }

            filteredPolicies.forEach(policy => {
                // Card view
                const badgeClass = policy.status === 'active' ? 'active' : policy.status === 'inactive' ? 'inactive' : 'draft';
                const badgeText = policy.status.charAt(0).toUpperCase() + policy.status.slice(1);
                
                const card = document.createElement('div');
                card.className = 'policy-card';
                card.innerHTML = `
                    <div class="policy-header">
                        <div>
                            <h3 class="policy-name">${policy.name}</h3>
                            <p class="policy-description">${policy.holder}</p>
                        </div>
                        <div class="policy-badge ${badgeClass}">${badgeText}</div>
                    </div>
                    <p class="policy-description">${policy.description}</p>
                    <div class="policy-details">
                        <div class="detail-row">
                            <span class="detail-label">Type:</span>
                            <span class="detail-value">${policy.type}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Coverage:</span>
                            <span class="detail-value">$${policy.coverage.toLocaleString()}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Premium:</span>
                            <span class="detail-value">$${policy.premium.toFixed(2)}/mo</span>
                        </div>
                    </div>
                    <div class="policy-meta">
                        <div class="meta-item">📅 ${new Date(policy.created).toLocaleDateString()}</div>
                        <div class="meta-item">👥 ${policy.holder}</div>
                    </div>
                    <div class="policy-actions">
                        <button class="policy-btn" onclick="editPolicy(${policy.id})">Edit</button>
                        <button class="policy-btn" onclick="viewPolicy(${policy.id})">View</button>
                        <button class="policy-btn delete" onclick="deletePolicy(${policy.id})">Delete</button>
                    </div>
                `;
                cardsContainer.appendChild(card);

                // Table view
                const row = tableBody.insertRow();
                row.innerHTML = `
                    <td style="font-weight:600;">${policy.name}</td>
                    <td>${policy.type}</td>
                    <td>$${policy.coverage.toLocaleString()}</td>
                    <td>$${policy.premium.toFixed(2)}/mo</td>
                    <td>
                        <span class="status-indicator ${policy.status}"></span>
                        ${badgeText}
                    </td>
                    <td>${new Date(policy.created).toLocaleDateString()}</td>
                    <td>
                        <button class="policy-btn" onclick="editPolicy(${policy.id})" style="width:60px;">Edit</button>
                    </td>
                `;
            });
        }

        function filterByStatus(status, element) {
            currentFilter = status;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            applyFilters();
        }

        function filterPolicies(searchTerm) {
            applyFilters(searchTerm);
        }

        function applyFilters(searchTerm = '') {
            filteredPolicies = allPolicies.filter(policy => {
                const matchesStatus = currentFilter === 'all' || policy.status === currentFilter;
                const matchesSearch = policy.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                    policy.type.toLowerCase().includes(searchTerm.toLowerCase());
                return matchesStatus && matchesSearch;
            });
            renderPolicies();
        }

        function switchView(view, element) {
            currentView = view;
            document.querySelectorAll('.view-toggle button').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            document.getElementById('cardsView').style.display = view === 'cards' ? 'grid' : 'none';
            document.getElementById('tableView').style.display = view === 'table' ? 'block' : 'none';
        }

        function openCreateModal() {
            document.getElementById('policyModal').style.display = 'flex';
        }

        function closeCreateModal() {
            document.getElementById('policyModal').style.display = 'none';
            document.getElementById('policyName').value = '';
            document.getElementById('policyType').value = '';
            document.getElementById('coverageAmount').value = '';
            document.getElementById('premium').value = '';
            document.getElementById('description').value = '';
        }

        function savePolicy(event) {
            event.preventDefault();
            const newPolicy = {
                id: Math.max(...allPolicies.map(p => p.id)) + 1,
                name: document.getElementById('policyName').value,
                type: document.getElementById('policyType').value,
                coverage: parseInt(document.getElementById('coverageAmount').value),
                premium: parseFloat(document.getElementById('premium').value),
                status: 'active',
                description: document.getElementById('description').value,
                created: new Date().toISOString().split('T')[0],
                holder: 'Admin Created'
            };
            allPolicies.push(newPolicy);
            applyFilters();
            closeCreateModal();
            alert('Policy created successfully!');
        }

        function editPolicy(id) {
            const policy = allPolicies.find(p => p.id === id);
            if (policy) {
                alert(`Edit functionality for: ${policy.name}\nThis would open an edit modal with the policy details.`);
            }
        }

        function viewPolicy(id) {
            const policy = allPolicies.find(p => p.id === id);
            if (policy) {
                alert(`Viewing: ${policy.name}\n\nType: ${policy.type}\nCoverage: $${policy.coverage.toLocaleString()}\nPremium: $${policy.premium.toFixed(2)}/month\nStatus: ${policy.status}`);
            }
        }

        function deletePolicy(id) {
            if (confirm('Are you sure you want to delete this policy?')) {
                allPolicies = allPolicies.filter(p => p.id !== id);
                applyFilters();
                alert('Policy deleted successfully!');
            }
        }

        // Initial render
        renderPolicies();
    </script>
</body>
</html>
