<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InsureX - Login</title>
    <!-- Added FontAwesome icons support to complement your alerts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #0d3b66, #1d6fa5);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 36px 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand h1 {
            margin: 0;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .login-form {
            display: grid;
            gap: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        .field label {
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
            color: #d4e3ff;
        }

        .field input {
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.9);
            outline: none;
            color: #0f172a;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        .field input:focus {
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(255, 209, 102, 0.4);
        }

        .submit-btn {
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: #ffd166;
            color: #0d3b66;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-top: 8px;
        }

        .submit-btn:hover {
            background: #ffca47;
        }

        /* Modernized Responsive Notification Banners */
        .alert-banner {
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            line-height: 1.4;
        }

        .error-banner {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }

        .success-banner {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #a7f3d0;
        }

        .footer {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
        }

        .footer p {
            margin: 8px 0;
            color: #cbd5e1;
        }

        .footer a {
            color: #ffd166;
            text-decoration: none;
            font-weight: 500;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<main class="login-container">

    <div class="brand">
        <h1>User Login</h1>
    </div>

    <!-- Container Notifications Location -->
    <div th:if="${param.error}" class="alert-banner error-banner">
        <i class="fa-solid fa-circle-xmark"></i>
        <span>Invalid email or password. Please verify credentials.</span>
    </div>

    <div th:if="${param.logout}" class="alert-banner success-banner">
        <i class="fa-solid fa-circle-check"></i>
        <span>Session ended. You have been safely disconnected.</span>
    </div>

    <form class="login-form" th:action="@{/login}" method="post" style="margin-top: 12px;">

        <div class="field">
            <label for="email">Email Address</label>
            <input id="email" name="email" type="email" placeholder="Enter your email" required />
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Enter your password" required />
        </div>

        <!-- Anti-Cross Site Request Forgery Security Tokens Injection -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <button type="submit" class="submit-btn">
            Sign In
        </button>

        <div class="footer">
            <p>
                New user?
                <a th:href="@{/signup}">Register here</a>
            </p>
            <p>
                <a th:href="@{/}">Back to Home</a>
            </p>
        </div>

    </form>

</main>

</body>
</html>
