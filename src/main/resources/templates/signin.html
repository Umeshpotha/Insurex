<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InsureX - Login</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #0d3b66, #1d6fa5);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 36px 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand h1 {
            margin: 0;
        }

        .login-form {
            display: grid;
            gap: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        .field label {
            margin-bottom: 6px;
        }

        .field input {
            padding: 12px;
            border-radius: 10px;
            border: none;
            outline: none;
            color: #000;
        }

        .submit-btn {
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: #ffd166;
            font-weight: bold;
            cursor: pointer;
        }

        .error {
            color: #ff6b6b;
            text-align: center;
            font-size: 0.9rem;
        }

        .success {
            color: #4caf50;
            text-align: center;
            font-size: 0.9rem;
        }

        .footer {
            text-align: center;
            margin-top: 10px;
        }

        .footer p {
            margin: 8px 0;
        }

        .footer a {
            color: #d4e3ff;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<main class="login-container">

    <div class="brand">
        <h1>User Login</h1>
    </div>

    <form class="login-form" th:action="@{/login}" method="post">

        <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="Enter your email" required />
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Enter your password" required />
        </div>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="error" th:if="${param.error}">
            Invalid email or password ❌
        </div>

        <div class="success" th:if="${param.logout}">
            Logged out successfully ✅
        </div>

        <button type="submit" class="submit-btn">
            Sign In
        </button>

        <div class="footer">
            <p>
                New user?
                <a th:href="@{/signup}">Register here</a>
            </p>
            <p>
                <a th:href="@{/}">Back to Home</a>
            </p>
        </div>

    </form>

</main>

</body>
</html>
