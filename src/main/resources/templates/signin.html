<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InsureX - Login</title>

    <style>
        :root {
            --bg: #f6f8fb;
            --card: #ffffff;
            --accent: #0b6cf6;
            --accent-dark: #7c3aed;
            --muted: #6b7280;
            --dark: #0f172a;
            --radius: 10px;
            --font-stack: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--dark);
            font-family: var(--font-stack);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            background: var(--card);
            border-radius: var(--radius);
            padding: 32px;
            box-shadow: 0 10px 30px rgba(11, 15, 30, 0.06);
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
            text-align: center;
        }

        .logo {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            border-radius: 10px;
            display: inline-grid;
            place-items: center;
            color: white;
            font-weight: 700;
            font-size: 18px;
            box-shadow: 0 4px 14px rgba(11, 108, 246, 0.14);
        }

        .brand h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand .subtitle {
            color: var(--muted);
            font-size: 13px;
            margin-top: 4px;
        }

        .login-form {
            display: grid;
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field label {
            font-size: 13px;
            font-weight: 600;
            color: var(--dark);
        }

        .field input {
            padding: 11px 14px;
            border: 1px solid #eef2f7;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            color: var(--dark);
            background: #f8fafc;
            outline: none;
            transition: border-color 0.15s ease, background-color 0.15s ease;
        }

        .field input:focus {
            background: var(--card);
            border-color: var(--accent);
        }

        .field input::placeholder {
            color: var(--muted);
            opacity: 0.7;
        }

        .submit-btn {
            border: 0;
            padding: 12px;
            border-radius: 8px;
            background: linear-gradient(90deg, var(--accent), var(--accent-dark));
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(11, 108, 246, 0.12);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
            margin-top: 6px;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 28px rgba(11, 108, 246, 0.2);
        }

        .footer {
            text-align: center;
            margin-top: 12px;
            padding-top: 16px;
            border-top: 1px solid #eef2f7;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 13px;
        }

        .footer p {
            margin: 0;
            color: var(--muted);
        }

        .footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.15s ease;
        }

        .footer a:hover {
            color: var(--accent-dark);
            text-decoration: underline;
        }
    </style>
</head>

<body>

<!-- ✅ Clean Fragment Hook - Handles Login Errors, Success Messages, and Logout Popups Globally -->
<div th:replace="~{fragments :: toaster}"></div>

<main class="login-container">

    <div class="brand">
        <div class="logo">IX</div>
        <div>
            <h1>User Login</h1>
            <div class="subtitle">Secure access to your InsureX dashboard</div>
        </div>
    </div>

    <form class="login-form" th:action="@{/login}" method="post">

        <div class="field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" placeholder="name@example.com" required />
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Enter your account password" required />
        </div>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <button type="submit" class="submit-btn">
            Sign In
        </button>

        <div class="footer">
            <p>
                New to the platform?
                <a th:href="@{/signup}">Register here</a>
            </p>
            <p>
                <a th:href="@{/}">Back to Home</a>
            </p>
        </div>

    </form>

</main>

</body>
</html>
