<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>InsureX — Claims</title>


<style>
:root{
    --bg:#f6f8fb;
    --card:#ffffff;
    --accent:#0b6cf6;
    --muted:#6b7280;
    --success:#16a34a;
    --danger:#ef4444;
    --warning:#f59e0b;
    font-family: Inter, system-ui;
}

body{margin:0;padding:16px;background:var(--bg);}

header{
            display:flex;
            gap:16px;
            align-items:center;
            justify-content:space-between;
            margin-bottom:20px;
            flex-wrap:wrap;
            width:100%;
        }

.controls{
            display:flex;
            gap:12px;
            align-items:center;
        }

.brand{
    display:flex;
    gap:12px;
    align-items:center;
}
.muted{ color:var(--muted); font-size:13px; }
.logo{
    width:44px;
    height:44px;
    background:linear-gradient(135deg,var(--accent),#7c3aed);
    border-radius:10px;
    display:inline-grid;
    place-items:center;
    color:white;
    font-weight:700;
    box-shadow:0 4px 14px rgba(11,108,246,0.14);
}
.brand-text h2{margin:0;font-size:18px;}
.brand-text p{margin:0;font-size:12px;color:var(--muted);}

        nav ul{
            display:flex;
            gap:12px;
            list-style:none;
            padding:0;margin:0;
            align-items:center;
            flex-wrap:wrap;
        }
        nav a{
            color:var(--muted);
            text-decoration:none;
            padding:8px 12px;
            border-radius:8px;
            font-size:14px;
        }
        nav a.active{
            background:linear-gradient(90deg, rgba(11,108,246,0.12), rgba(124,58,237,0.06));
            color:var(--accent);
            font-weight:600;
        }


.claims-container{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:16px;
}

.card{
    background:white;
    padding:16px;
    border-radius:12px;
    border:1px solid #ddd;
}

.badge{
    font-size:12px;
    padding:4px 8px;
    border-radius:6px;
}
.pending{background:#fef3c7;}
.approved{background:#dcfce7;color:green;}
.rejected{background:#fee2e2;color:red;}

.btn{
    border:0;
    padding:10px 14px;
    border-radius:8px;
    background:var(--card);
    cursor:pointer;
    box-shadow:0 1px 2px rgba(16,24,40,0.04);
    color:var(--muted);
    font-weight:600;
}
.btn.primary{
    background:linear-gradient(90deg,var(--accent),#7c3aed);
    color:white;
    box-shadow:0 8px 24px rgba(11,108,246,0.12);
}
.accept{background:green;color:white;}
.reject{background:red;color:white;}

.search{margin-bottom:12px;}
.search input{
    padding:10px;
    width:100%;
    border-radius:8px;
    border:1px solid #ddd;
}
.filter-btn{
    padding:8px 12px;
    border:1px solid #ddd;
    background:white;
    border-radius:6px;
    cursor:pointer;
    margin-right:6px;
}

.filter-btn.active{
    background:#e0ebff;
    color:#0b6cf6;
    border-color:#0b6cf6;
}


</style>
</head>

<body>


<header>
     <div class="brand">
            <div class="logo">IX</div>
            <div>
                <div style="font-weight:700">InsureX</div>
                <div class="muted" style="font-size:12px;margin-top:2px">Policy management dashboard</div>
            </div>
        </div>

        <nav>
            <ul>
                <li><a href="#">Dashboard</a></li>
                <li><a href="#">Policies</a></li>
                <li><a href="#" class="active">Claims</a></li>
                <li><a href="#">Customers</a></li>
                <li><a href="#">Settlements</a></li>
            </ul>
        </nav>

         <div class="controls">
            <button class="btn" onclick="showActivityToasts()">Notifications</button>
            <button class="btn">Profile</button>
            <button class="btn primary" onclick="actionCreatePolicy()">Create Policy</button>
        </div>
</header>

<h2>📄 Claims Management</h2>

<div class="search">
    <input placeholder="Search claims..." onkeyup="searchClaims(this.value)">
</div>

<div style="margin-bottom:12px;">
    <button onclick="filterByStatus('all', this)" class="filter-btn active">All</button>
    <button onclick="filterByStatus('pending', this)" class="filter-btn">Pending</button>
    <button onclick="filterByStatus('approved', this)" class="filter-btn">Approved</button>
    <button onclick="filterByStatus('rejected', this)" class="filter-btn">Rejected</button>
</div>


<div id="claimsContainer" class="claims-container"></div>

<script>
let claims = [
    {id:1, name:"John", policy:"Auto", amount:12000, status:"pending"},
    {id:2, name:"Alice", policy:"Health", amount:5000, status:"pending"},
    {id:3, name:"Rahul", policy:"Home", amount:25000, status:"approved"}
];
let currentStatus = 'all';
let filtered = [...claims];
function filterByStatus(status, element){
    currentStatus = status;

    document.querySelectorAll('.filter-btn').forEach(btn =>
        btn.classList.remove('active')
    );
    element.classList.add('active');

    applyFilters();
}


function render(){
    const container = document.getElementById('claimsContainer');
    container.innerHTML="";

    filtered.forEach(c=>{
        const div = document.createElement("div");
        div.className="card";

        div.innerHTML = `
            <b>#${c.id}</b>
            <span class="badge ${c.status}">${c.status}</span>
            <p><b>${c.name}</b></p>
            <p>${c.policy} Policy</p>
            <p>$${c.amount}</p>

            ${c.status==="pending"?`
            <button class="btn accept" onclick="update(${c.id},'approved')">Accept</button>
            <button class="btn reject" onclick="update(${c.id},'rejected')">Reject</button>
            `:""}
        `;
        container.appendChild(div);
    });
}

function update(id,status){
    let c = claims.find(x=>x.id===id);
    c.status = status;
    searchClaims('');
    alert("Claim " + status);
    applyFilters();
}

function searchClaims(txt){
    filtered = claims.filter(c =>
        c.name.toLowerCase().includes(txt.toLowerCase()) ||
        c.policy.toLowerCase().includes(txt.toLowerCase())
    );
    render();
    applyFilters(txt);
}
function applyFilters(searchText = ''){
    filtered = claims.filter(c => {
        const matchesSearch =
            c.name.toLowerCase().includes(searchText.toLowerCase()) ||
            c.policy.toLowerCase().includes(searchText.toLowerCase());

        const matchesStatus =
            currentStatus === 'all' || c.status === currentStatus;

        return matchesSearch && matchesStatus;
    });

    render();
}

render();
</script>

</body>
</html>
