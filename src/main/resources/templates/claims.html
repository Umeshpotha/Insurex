<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Applications</title>
<style>:root{--blue:#0b6cf6;--purple:#7c3aed;--bg:#f6f8fb;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui;color:#0f172a}header{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;background:white;border-bottom:1px solid #e2e8f0;gap:18px;flex-wrap:wrap}.brand{font-weight:800;font-size:20px}nav{display:flex;gap:8px;flex-wrap:wrap}a,.btn{padding:10px 14px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:650;border:0;cursor:pointer;background:white}nav a.active,.primary{background:linear-gradient(90deg,var(--blue),var(--purple));color:white}.wrap{max-width:1200px;margin:28px auto;padding:0 20px}.card{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:var(--muted)}.badge{padding:5px 9px;border-radius:999px;background:#fef3c7;color:#92400e;font-size:12px}.Approved{background:#dcfce7;color:#166534}.Rejected{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:8px;margin-top:14px}.approve{background:#16a34a;color:white}.reject{background:#dc2626;color:white}.notice{padding:12px;border-radius:8px;margin-bottom:14px;background:#dcfce7;color:#166534}</style></head>
<body><header><div class="brand">IX InsureX Admin</div><nav><a th:href="@{/admin}">Dashboard</a><a th:href="@{/admin/policies}">Policies</a><a class="active" th:href="@{/admin/claims}">Applications</a><a th:href="@{/admin/customers}">Customers</a></nav><form th:action="@{/logout}" method="post"><button class="btn">Sign out</button></form></header>
<main class="wrap"><div th:if="${success}" class="notice" th:text="${success}"></div><h1>Policy applications</h1><p class="muted">Review customer applications and approve or reject them.</p><section class="grid"><article class="card" th:each="claim:${claims}"><div class="row"><strong th:text="${'#APP-'+claim.id}">#APP-1</strong><span class="badge" th:classappend="${claim.status}" th:text="${claim.status}">Pending</span></div><h3 th:text="${claim.policyName}">Policy</h3><p><strong th:text="${claim.user.username}">Customer</strong><br><span class="muted" th:text="${claim.user.email}">email</span></p><div class="row"><span>Category</span><strong th:text="${claim.category}">Health</strong></div><div class="row"><span>Coverage</span><strong th:text="${'INR '+claim.claimAmount}">INR 0</strong></div><div class="actions"><form th:action="@{/admin/claims/{id}/status(id=${claim.id})}" method="post"><input type="hidden" name="status" value="Approved"><button class="btn approve">Approve</button></form><form th:action="@{/admin/claims/{id}/status(id=${claim.id})}" method="post"><input type="hidden" name="status" value="Rejected"><button class="btn reject">Reject</button></form><form th:if="${claim.status != 'Pending'}" th:action="@{/admin/claims/{id}/status(id=${claim.id})}" method="post"><input type="hidden" name="status" value="Pending"><button class="btn">Reset</button></form></div></article><div class="card muted" th:if="${#lists.isEmpty(claims)}">No customer applications yet.</div></section></main></body></html>
