<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InsureX — Error</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
        body { margin: 0; background: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .error-card { background: white; border-radius: 16px; border: 1px solid #e2e8f0; padding: 48px 40px; text-align: center; max-width: 440px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,0.04); }
        .icon { font-size: 48px; color: #ef4444; margin-bottom: 20px; }
        h1 { margin: 0 0 12px; font-size: 22px; color: #0f172a; }
        p { color: #64748b; font-size: 15px; margin: 0 0 28px; }
        a { display: inline-block; padding: 11px 24px; background: #2563eb; color: white; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px; }
        a:hover { background: #1d4ed8; }
    </style>
</head>
<body>
<div class="error-card">
    <div class="icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
    <h1>Something went wrong</h1>
    <p th:text="${errorMessage} ?: 'An unexpected error occurred. Please try again.'">Error details.</p>
    <a th:href="@{/dashboard}">Go to Dashboard</a>
</div>
</body>
</html>
